name: "Release"
on:
  release:
    types: [ published ]
permissions: { }
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  JAVA_DISTRIBUTION: 'liberica'
  REPO_NAME: ${{ github.event.repository.name }}
  RUN_ID: ${{ github.run_id }}
  TAG: ${{ github.event.release.tag_name }}
  VERSION: 'will be computed in each job'
concurrency:
  group: release-pipeline
  cancel-in-progress: false
jobs:
  publish:
    name: "Stage Jar Files"
    permissions:
      packages: read
      contents: write
      issues: write
    runs-on: ubuntu-24.04
    steps:
      - name: "Establish release version"
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ env.TAG }}
      - name: "Generate key file for artifact signing"
        env:
          SECRING_FILE: ${{ secrets.SECRING_FILE }}
        run: echo "$SECRING_FILE" | base64 -d > ${{ github.workspace }}/secring.gpg
      - name: "Extract SDK config"
        id: sdk
        run: |
          java=$(grep '^java=' .sdkmanrc | cut -d'=' -f2 | sed 's/-.*//')
          echo "java-version=$java" >> $GITHUB_OUTPUT
      - name: "Set up JDK"
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ steps.sdk.outputs.java-version }}
      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v4
      - name: "Run pre-release"
        uses: apache/grails-github-actions/pre-release@asf
        env:
          RELEASE_VERSION: ${{ env.VERSION }}
      - name: "Publish to Maven Central"
        env:
          NEXUS_PUBLISH_USERNAME: ${{ secrets.NEXUS_PUBLISH_USERNAME }}
          NEXUS_PUBLISH_PASSWORD: ${{ secrets.NEXUS_PUBLISH_PASSWORD }}
          NEXUS_PUBLISH_URL: 'https://ossrh-staging-api.central.sonatype.com/service/local/'
          NEXUS_PUBLISH_DESCRIPTION: '${{ env.REPO_NAME }}:${{ env.VERSION }}:${{ env.RUN_ID }}'
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: >
          ./gradlew
          -Pversion="${{ env.VERSION }}"
          -Psigning.secretKeyRingFile=${{ github.workspace }}/secring.gpg
          publishMavenPublicationToSonatypeRepository
          closeSonatypeStagingRepository
  release:
    name: "Make Release Files Available"
    environment: release
    needs: [ publish ]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: "Establish release version"
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ env.TAG }}
      - name: "Extract SDK config"
        id: sdk
        run: |
          java=$(grep '^java=' .sdkmanrc | cut -d'=' -f2 | sed 's/-.*//')
          echo "java-version=$java" >> $GITHUB_OUTPUT
      - name: "Set up JDK"
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ steps.sdk.outputs.java-version }}
      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v4
      - name: "Release staging repository"
        env:
          NEXUS_PUBLISH_USERNAME: ${{ secrets.NEXUS_PUBLISH_USERNAME }}
          NEXUS_PUBLISH_PASSWORD: ${{ secrets.NEXUS_PUBLISH_PASSWORD }}
          NEXUS_PUBLISH_URL: 'https://ossrh-staging-api.central.sonatype.com/service/local/'
          NEXUS_PUBLISH_DESCRIPTION: '${{ env.REPO_NAME }}:${{ env.VERSION }}:${{ env.RUN_ID }}'
        run: >
          ./gradlew
          findSonatypeStagingRepository
          releaseSonatypeStagingRepository
  close:
    name: "To Next Version"
    environment: close
    needs: [ publish, release ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "Run post-release"
        uses: apache/grails-github-actions/post-release@asf
